services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: linkbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: linkbox

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkbox -d linkbox"]
      interval: 5s

      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  backend:
    build: ./backend
    environment: 
    - PORT=4000
    - DATABASE_URL=postgres://linkbox:${POSTGRES_PASSWORD}@postgres:5432/linkbox
    - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  pgdata:
